name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write
  id-token: write

env:
  NPM_CONFIG_PROVENANCE: true
  PNPM_CONFIG_PROVENANCE: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Test
        run: pnpm -s test:ci

      - name: Get Next Package Version
        id: package-version
        run: |
          pnpm -s changeset status --output=release.json
          version=$(jq -rs '.[0].releases[0].newVersion // .[1].version' release.json package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          rm release.json

      - name: Create Release Pull Request or Publish to NPM
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: pnpm -s changeset publish
          commit-message: "chore(release): v${{ steps.package-version.outputs.version }}"
          github-token: ${{ secrets.GITHUB_TOKEN }}
